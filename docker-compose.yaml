services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      # Consumed by init/06-create-patients-view.sh to build the FEDERATED
      # bridge to the upstream cnics_data.Patient table. See default.env
      # for the var meanings and the read-only requirement on the bridge
      # user.
      CNICS_DATA_DB_NAME: ${CNICS_DATA_DB_NAME}
      CNICS_DATA_DB_TABLE: ${CNICS_DATA_DB_TABLE}
      CNICS_DATA_DB_USER: ${CNICS_DATA_DB_USER}
      CNICS_DATA_DB_PASSWORD: ${CNICS_DATA_DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - logs-data:/var/log/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./init:/docker-entrypoint-initdb.d
      # The cnics_data server listens only on the VM host's loopback, so
      # the FEDERATED proxy reaches it over the host's MariaDB/MySQL Unix
      # socket. Bind-mount the host socket directory in; init/06 reads
      # /run/cnics_data_host/mysqld.sock. (A directory mount — not a file
      # mount — so it survives the host server recreating its socket.)
      - ${CNICS_DATA_SOCKET_DIR:-/var/run/mysqld}:/run/cnics_data_host
    networks:
      - internal

  backend:
    build: ./flask_backend
    environment:
      ALLOW_DEV_HEADER: "${ALLOW_DEV_HEADER:-0}"
      DB_HOST: mariadb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      FILES_DIR: /files
      UPLOAD_DIR: /opt/backend/uploads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      # Outbound email configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_TLS: ${SMTP_TLS}
      SMTP_SSL: ${SMTP_SSL}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      EMAIL_HELP_ADDRESS: ${EMAIL_HELP_ADDRESS}
      EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX}
      EMAIL_ATTACH_PACKET: ${EMAIL_ATTACH_PACKET}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE}
      PORT: 3000
      # Structured logging configuration
      LOG_FORMAT: ${LOG_FORMAT:-JSON}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_NAME: ${APP_NAME:-cnics-validation-backend}
      # Study workflow configuration, resolved by flask_backend/study_config.py.
      # STUDY_TYPE selects the study's default control profile; each control
      # below overrides that profile when set. Compose reads these from .env
      # for ${...} substitution but does NOT auto-inject them — they must be
      # listed here to reach the container. An unset control passes through as
      # an empty string, which study_config treats as "use the profile default".
      STUDY_TYPE: ${STUDY_TYPE:-mci}
      ENABLE_SCRUBBING: ${ENABLE_SCRUBBING:-}
      ENABLE_SCREENING: ${ENABLE_SCREENING:-}
      ENABLE_SENDING: ${ENABLE_SENDING:-}
      REVIEWER_COUNT: ${REVIEWER_COUNT:-}
    depends_on:
      - mariadb
    ports:
      - "127.0.0.1:${BACKEND_EXTERNAL_PORT:-3001}:3000"
    networks:
      - internal
    volumes:
      - ${FILES_DIR:-./app/webroot/files}:/files:ro
      - cnics-downloads:/opt/backend/uploads

  web:
    build:
      context: ./frontend
      target: development_build
    env_file:
      - ./frontend/default.env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${EXTERNAL_PORT:-3000}:3000"
    networks:
      - internal
      

volumes:
  logs-data:
  mariadb-data:
  cnics-downloads:

networks:
  internal:
