services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - logs-data:/var/log/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - internal

  backend:
    build: ./flask_backend
    environment:
      ALLOW_DEV_HEADER: "1"
      DB_HOST: mariadb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      FILES_DIR: /files
      UPLOAD_DIR: /opt/backend/uploads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      PORT: 3000
      # Structured logging configuration
      LOG_FORMAT: ${LOG_FORMAT:-JSON}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_NAME: ${APP_NAME:-cnics-validation-backend}
    depends_on:
      - mariadb
    ports:
      - "3001:3000"
    networks:
      - internal
    volumes:
      - ${FILES_DIR:-./app/webroot/files}:/files:ro
      - ./downloads:/opt/backend/uploads

  web:
    build:
      context: ./frontend
      target: development_build
    env_file:
      - ./frontend/default.env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${EXTERNAL_PORT:-3000}:3000"
    networks:
      - internal
      

volumes:
  logs-data:
  mariadb-data:

networks:
  internal:
