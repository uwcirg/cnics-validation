services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - logs-data:/var/log/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - internal

  backend:
    build: ./flask_backend
    environment:
      ALLOW_DEV_HEADER: "${ALLOW_DEV_HEADER:-0}"
      DB_HOST: mariadb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      FILES_DIR: /files
      UPLOAD_DIR: /opt/backend/uploads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      # Outbound email configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_TLS: ${SMTP_TLS}
      SMTP_SSL: ${SMTP_SSL}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      EMAIL_HELP_ADDRESS: ${EMAIL_HELP_ADDRESS}
      EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX}
      EMAIL_ATTACH_PACKET: ${EMAIL_ATTACH_PACKET}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE}
      PORT: 3000
      # Structured logging configuration
      LOG_FORMAT: ${LOG_FORMAT:-JSON}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_NAME: ${APP_NAME:-cnics-validation-backend}
    depends_on:
      - mariadb
    ports:
      - "127.0.0.1:${BACKEND_EXTERNAL_PORT:-3001}:3000"
    networks:
      - internal
    volumes:
      - ${FILES_DIR:-./app/webroot/files}:/files:ro
      - cnics-downloads:/opt/backend/uploads

  web:
    build:
      context: ./frontend
      target: development_build
    env_file:
      - ./frontend/default.env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${EXTERNAL_PORT:-3000}:3000"
    networks:
      - internal
      

volumes:
  logs-data:
  mariadb-data:
  cnics-downloads:

networks:
  internal:
